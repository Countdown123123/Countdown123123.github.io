<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countdown</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --orange: #ff6a00;
    --orange2: #ff9d52;
    --bg: #070707;
    --card: rgba(255,255,255,.07);
    --border: rgba(255,255,255,.13);
    --text: #fff;
    --muted: #999;
}

body {
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);

    background:
        radial-gradient(circle at 50% 0%, rgba(255,106,0,.18), transparent 35%),
        #070707;
}

.container {
    width: min(100%, 900px);
    text-align: center;
}

.badge {
    display: inline-block;
    padding: 8px 15px;
    border-radius: 999px;

    color: var(--orange2);
    background: rgba(255,106,0,.1);
    border: 1px solid rgba(255,106,0,.3);

    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;

    margin-bottom: 25px;
}

h1 {
    font-size: clamp(45px, 9vw, 90px);
    letter-spacing: -4px;
    margin-bottom: 15px;
}

.subtitle {
    color: var(--muted);
    margin-bottom: 35px;
}

.setup {
    max-width: 550px;
    margin: auto;
    padding: 25px;

    border: 1px solid var(--border);
    border-radius: 22px;

    background: var(--card);
    backdrop-filter: blur(20px);
}

.field {
    text-align: left;
    margin-bottom: 18px;
}

label {
    display: block;
    color: #bbb;
    font-size: 13px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: rgba(0,0,0,.35);
    color: white;

    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: var(--orange);
}

button {
    width: 100%;
    padding: 14px;

    border: 0;
    border-radius: 12px;

    background: var(--orange);
    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(255,106,0,.25);
}

.share {
    margin-top: 10px;
    background: rgba(255,255,255,.08);
}

.countdown {
    display: none;

    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.unit {
    padding: 30px 10px;

    border: 1px solid var(--border);
    border-radius: 20px;

    background: var(--card);
    backdrop-filter: blur(20px);
}

.number {
    font-size: clamp(40px, 8vw, 80px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
}

.label {
    margin-top: 10px;

    color: var(--muted);

    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.target {
    display: none;
    margin-top: 25px;
    color: var(--muted);
}

.finished {
    display: none;

    font-size: clamp(35px, 8vw, 80px);
    font-weight: 800;

    color: var(--orange);
}

.error {
    color: #ff7777;
    margin-top: 15px;
}

@media(max-width:650px) {
    .countdown {
        grid-template-columns: repeat(2, 1fr);
    }

    h1 {
        letter-spacing: -2px;
    }

    .unit {
        padding: 25px 8px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="badge">Countdown</div>

    <h1 id="title">Create Countdown</h1>

    <p class="subtitle" id="subtitle">
        Choose when your countdown should end.
    </p>

    <!-- SETUP -->

    <div class="setup" id="setup">

        <div class="field">
            <label>Countdown title</label>
            <input
                id="titleInput"
                type="text"
                placeholder="Christmas"
            >
        </div>

        <div class="field">
            <label>Date</label>
            <input
                id="dateInput"
                type="date"
            >
        </div>

        <div class="field">
            <label>Time</label>
            <input
                id="timeInput"
                type="time"
                value="00:00"
            >
        </div>

        <button onclick="createCountdown()">
            Create Countdown
        </button>

        <div id="error" class="error"></div>

    </div>

    <!-- COUNTDOWN -->

    <div class="countdown" id="countdown">

        <div class="unit">
            <div class="number" id="days">00</div>
            <div class="label">Days</div>
        </div>

        <div class="unit">
            <div class="number" id="hours">00</div>
            <div class="label">Hours</div>
        </div>

        <div class="unit">
            <div class="number" id="minutes">00</div>
            <div class="label">Minutes</div>
        </div>

        <div class="unit">
            <div class="number" id="seconds">00</div>
            <div class="label">Seconds</div>
        </div>

    </div>

    <div class="finished" id="finished">
        EVENT STARTED
    </div>

    <div class="target" id="target">
        Target: <span id="targetText"></span>
    </div>

    <button
        class="share"
        id="shareButton"
        style="display:none"
        onclick="copyLink()"
    >
        🔗 Copy Countdown Link
    </button>

</div>

<script>

let targetDate;
let timer;

const params = new URLSearchParams(location.search);

const urlDate = params.get("date");
const urlTitle = params.get("title");


// If a date exists in the URL,
// automatically show the countdown.

if (urlDate) {

    const parsed = new Date(urlDate);

    if (!isNaN(parsed.getTime())) {

        targetDate = parsed;

        document.getElementById("setup").style.display = "none";

        document.getElementById("countdown").style.display = "grid";

        document.getElementById("target").style.display = "block";

        document.getElementById("shareButton").style.display = "block";

        if (urlTitle) {
            document.getElementById("title").textContent = urlTitle;
        } else {
            document.getElementById("title").textContent = "Countdown";
        }

        document.getElementById("subtitle").textContent =
            "Time remaining";

        document.getElementById("targetText").textContent =
            targetDate.toLocaleString();

        startCountdown();
    }
}


// Create a new countdown

function createCountdown() {

    const title =
        document.getElementById("titleInput").value.trim();

    const date =
        document.getElementById("dateInput").value;

    const time =
        document.getElementById("timeInput").value;

    const error =
        document.getElementById("error");

    error.textContent = "";

    if (!date) {
        error.textContent = "Please choose a date.";
        return;
    }

    if (!time) {
        error.textContent = "Please choose a time.";
        return;
    }

    const localDate =
        new Date(`${date}T${time}`);

    if (isNaN(localDate.getTime())) {
        error.textContent = "Invalid date or time.";
        return;
    }

    if (localDate <= new Date()) {
        error.textContent = "Please choose a future date.";
        return;
    }

    const url =
        new URL(window.location.href);

    url.searchParams.set(
        "date",
        localDate.toISOString()
    );

    if (title) {
        url.searchParams.set(
            "title",
            title
        );
    }

    window.location.href = url.toString();
}


// Countdown engine

function startCountdown() {

    updateCountdown();

    clearInterval(timer);

    timer = setInterval(
        updateCountdown,
        1000
    );
}


function updateCountdown() {

    const now = new Date();

    const difference =
        targetDate - now;

    if (difference <= 0) {

        clearInterval(timer);

        document.getElementById("countdown").style.display =
            "none";

        document.getElementById("target").style.display =
            "none";

        document.getElementById("finished").style.display =
            "block";

        document.getElementById("subtitle").textContent =
            "The countdown has reached zero.";

        return;
    }

    const totalSeconds =
        Math.floor(difference / 1000);

    const days =
        Math.floor(totalSeconds / 86400);

    const hours =
        Math.floor((totalSeconds % 86400) / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const seconds =
        totalSeconds % 60;

    document.getElementById("days").textContent =
        String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}


// Copy the generated URL

function copyLink() {

    navigator.clipboard
        .writeText(window.location.href)
        .then(() => {

            const button =
                document.getElementById("shareButton");

            const oldText =
                button.textContent;

            button.textContent =
                "✓ Link Copied!";

            setTimeout(() => {
                button.textContent = oldText;
            }, 2000);

        })
        .catch(() => {

            alert(window.location.href);

        });
}

</script>

</body>
</html>
